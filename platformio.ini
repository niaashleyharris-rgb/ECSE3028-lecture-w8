; ECSE3038 - Week 8, Lecture 1: the ESP32 shows your class-wall message on a 16x2 LCD.
; One project builds for a real ESP32 board and for the Wokwi simulator.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
